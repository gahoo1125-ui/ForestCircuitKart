name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: "stable"
      GODOT_BASE_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl xz-utils

      - name: Export Blender gold kart to GLB
        run: |
          set -euo pipefail
          mkdir -p build /tmp/gold-kart
          cat assets/models/gold_kart_blend_b64/part_*.txt | base64 -d > /tmp/gold-kart/gold_kart.blend
          test -s /tmp/gold-kart/gold_kart.blend

          BLENDER_URL="https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz"
          curl -L --fail --retry 3 "$BLENDER_URL" -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          BLENDER_BIN="/tmp/blender-5.2.2-linux-x64/blender"
          test -x "$BLENDER_BIN"

          "$BLENDER_BIN" --background /tmp/gold-kart/gold_kart.blend --python assets/models/export_gold_kart.py
          test -s build/gold_dragon_kart.glb
          ls -lh build/gold_dragon_kart.glb

      - name: Download Godot
        run: |
          curl -L --fail --retry 3 "$GODOT_BASE_URL/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          sudo ln -s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          curl -L --fail --retry 3 "$GODOT_BASE_URL/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TEMPLATE_DIR"
          cp -R /tmp/templates/templates/. "$TEMPLATE_DIR/"

      - name: Validate scripts
        run: |
          set -o pipefail
          godot --headless --path . --editor --quit 2>&1 | tee /tmp/godot-validate.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/godot-validate.log; then
            echo "GDScript validation failed."
            exit 1
          fi

      - name: Build Windows EXE
        run: |
          set -o pipefail
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" "build/ForestCircuitKart.exe" 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" /tmp/godot-export.log; then
            echo "GDScript export failed."
            exit 1
          fi
          test -f build/ForestCircuitKart.exe
          ls -lh build/ForestCircuitKart.exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForestCircuitKart-Windows
          path: |
            build/ForestCircuitKart.exe
            build/gold_dragon_kart.glb
          retention-days: 30
