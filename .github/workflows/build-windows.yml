name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_STATUS: "stable"
      GODOT_BASE_URL: "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip curl

      - name: Download Godot
        run: |
          curl -L --fail --retry 3 "$GODOT_BASE_URL/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64"
          sudo ln -s "/tmp/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Install export templates
        run: |
          curl -L --fail --retry 3 "$GODOT_BASE_URL/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$TEMPLATE_DIR"
          cp -R /tmp/templates/templates/. "$TEMPLATE_DIR/"

      - name: Validate and import
        run: godot --headless --path . --import

      - name: Build Windows EXE
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Windows Desktop" "build/ForestCircuitKart.exe"
          test -f build/ForestCircuitKart.exe
          ls -lh build/ForestCircuitKart.exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForestCircuitKart-Windows
          path: build/ForestCircuitKart.exe
          retention-days: 30
